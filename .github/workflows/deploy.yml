name: Deploy to Asc-webserver

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-asc-gstms
  cancel-in-progress: false

jobs:
  check:
    name: Syntax & dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile gstr1_dashboard.py saas_auth.py

  deploy:
    name: Deploy to VM
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, install, restart, health-check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -s' <<'DEPLOY'
          set -e
          cd /var/www/asc-gstms

          # ── Reclaim disk before anything that needs it ──────────────────
          # A failed Excel export leaves gigabytes of xlsxwriter scratch behind
          # (the COMBINED sheet alone peaks at ~2 GB of uncompressed XML). Before
          # the tmpdir fix that scratch went to /tmp, so the leftovers are in
          # BOTH places. Once the volume fills, git pull and pip install fail
          # with errors that say nothing about the real cause. Nobody here has
          # shell access to the VM, so this step is the only way to clear it.
          echo "=== disk before ==="
          df -h / | tail -1

          # 1. Our own scratch dir - safe to clear wholesale.
          find .xlsx_tmp -type f -mmin +60 -delete 2>/dev/null || true

          # 2. Scratch this app leaked into /tmp before the tmpdir fix.
          #    Deliberately narrow: tempfile-prefixed, LARGER THAN 10 MB, and
          #    untouched for an hour. Worksheet scratch runs to hundreds of MB,
          #    so that size floor keeps every ordinary /tmp file out of scope,
          #    and the age floor protects an export running right now.
          #    sudo -n so it never blocks on a password prompt; falls back to
          #    whatever the deploy user can remove on its own.
          echo "--- stale scratch in /tmp (candidates) ---"
          sudo -n find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 \
               -printf '%10s  %p\n' 2>/dev/null \
            || find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 \
               -printf '%10s  %p\n' 2>/dev/null \
            || echo "(none readable)"
          sudo -n find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 -delete 2>/dev/null \
            || find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 -delete 2>/dev/null \
            || true

          # 3. Standard, non-destructive reclamation. Rotated journals and cached
          #    .deb files are regenerable by definition - neither holds state any
          #    application depends on. Nothing else is touched automatically:
          #    this VM is shared with other services and the bulk of the disk sits
          #    in /var/lib, which can hold live databases. That is a human's call.
          echo "--- reclaiming journal + apt cache ---"
          sudo -n journalctl --vacuum-size=200M 2>/dev/null | tail -2 || echo "(journal vacuum unavailable)"
          sudo -n apt-get clean 2>/dev/null && echo "apt cache cleared" || echo "(apt clean unavailable)"

          echo "=== disk after cleanup ==="
          df -h / | tail -1

          AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')

          # Deploying and exporting need very different amounts of room, so gate
          # them separately. git pull + pip need a few hundred MB; blocking the
          # deploy on the export's 2.5 GB just keeps the fix off the server.
          if [ "$AVAIL_MB" -lt 500 ]; then
            echo "ERROR: only ${AVAIL_MB} MB free on / - not enough to even pull and install."
            echo ""
            echo "This is NOT the GSTR-1 app: /tmp and .xlsx_tmp are both empty."
            echo "Something else on this shared VM is holding the disk."
            echo "--- where the space is ---"
            sudo -n du -xh --max-depth=2 / 2>/dev/null | sort -rh | head -25 \
              || du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -25
            echo "--- /var/lib breakdown (the big one) ---"
            sudo -n du -xh --max-depth=2 /var/lib 2>/dev/null | sort -rh | head -20 \
              || echo "(needs sudo to read)"
            echo "--- usual suspects ---"
            sudo -n du -sh /var/lib/docker /var/lib/snapd /var/lib/mysql \
                 /var/lib/postgresql /var/lib/containerd 2>/dev/null || true
            sudo -n journalctl --disk-usage 2>/dev/null || true
            command -v docker >/dev/null && sudo -n docker system df 2>/dev/null || true
            echo ""
            echo "Send this output to whoever administers the VM."
            exit 1
          fi

          if [ "$AVAIL_MB" -lt 3072 ]; then
            echo "WARNING: only ${AVAIL_MB} MB free. Deploying anyway, but the Excel"
            echo "export needs ~2.5 GB of scratch and the app will refuse it with a"
            echo "clear message until the disk is freed. Space is going to /var/lib,"
            echo "not to this app."
          fi

          git pull --ff-only
          venv/bin/pip install -r requirements.txt --quiet
          sudo systemctl restart asc-gstms
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf -o /dev/null http://127.0.0.1:8502; then
              echo "App is up and responding."
              df -h / | tail -1
              exit 0
            fi
          done
          echo "App did not come back after restart. Recent logs:"
          journalctl -u asc-gstms -n 40 --no-pager
          exit 1
          DEPLOY
