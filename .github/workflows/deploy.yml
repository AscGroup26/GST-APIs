name: Deploy to Asc-webserver

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-asc-gstms
  cancel-in-progress: false

jobs:
  check:
    name: Syntax & dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile gstr1_dashboard.py saas_auth.py

  deploy:
    name: Deploy to VM
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, install, restart, health-check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -s' <<'DEPLOY'
          set -e
          cd /var/www/asc-gstms

          # ── Reclaim disk before anything that needs it ──────────────────
          # A failed Excel export leaves gigabytes of xlsxwriter scratch behind
          # (the COMBINED sheet alone peaks at ~2 GB of uncompressed XML). Once
          # the volume fills, git pull and pip install fail with errors that say
          # nothing about the real cause, so clear our own scratch first and
          # report the disk either way.
          echo "=== disk before ==="
          df -h / | tail -1
          find .xlsx_tmp -type f -mmin +60 -delete 2>/dev/null || true
          echo "=== disk after clearing .xlsx_tmp ==="
          df -h / | tail -1

          AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
          if [ "$AVAIL_MB" -lt 3072 ]; then
            echo "ERROR: only ${AVAIL_MB} MB free on /."
            echo "The GSTR-1 Excel export needs ~2.5 GB of scratch space to run."
            echo "Largest directories:"
            du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -10
            echo "Also check /tmp:"
            du -sh /tmp 2>/dev/null || true
            exit 1
          fi

          git pull --ff-only
          venv/bin/pip install -r requirements.txt --quiet
          sudo systemctl restart asc-gstms
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf -o /dev/null http://127.0.0.1:8502; then
              echo "App is up and responding."
              df -h / | tail -1
              exit 0
            fi
          done
          echo "App did not come back after restart. Recent logs:"
          journalctl -u asc-gstms -n 40 --no-pager
          exit 1
          DEPLOY
