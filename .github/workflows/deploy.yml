name: Deploy to Asc-webserver

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-asc-gstms
  cancel-in-progress: false

jobs:
  check:
    name: Syntax & dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile gstr1_dashboard.py saas_auth.py

  deploy:
    name: Deploy to VM
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, install, restart, health-check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -s' <<'DEPLOY'
          set -e
          cd /var/www/asc-gstms

          # ── Reclaim disk before anything that needs it ──────────────────
          # A failed Excel export leaves gigabytes of xlsxwriter scratch behind
          # (the COMBINED sheet alone peaks at ~2 GB of uncompressed XML). Before
          # the tmpdir fix that scratch went to /tmp, so the leftovers are in
          # BOTH places. Once the volume fills, git pull and pip install fail
          # with errors that say nothing about the real cause. Nobody here has
          # shell access to the VM, so this step is the only way to clear it.
          echo "=== disk before ==="
          df -h / | tail -1

          # 1. Our own scratch dir - safe to clear wholesale.
          find .xlsx_tmp -type f -mmin +60 -delete 2>/dev/null || true

          # 2. Scratch this app leaked into /tmp before the tmpdir fix.
          #    Deliberately narrow: tempfile-prefixed, LARGER THAN 10 MB, and
          #    untouched for an hour. Worksheet scratch runs to hundreds of MB,
          #    so that size floor keeps every ordinary /tmp file out of scope,
          #    and the age floor protects an export running right now.
          #    sudo -n so it never blocks on a password prompt; falls back to
          #    whatever the deploy user can remove on its own.
          echo "--- stale scratch in /tmp (candidates) ---"
          sudo -n find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 \
               -printf '%10s  %p\n' 2>/dev/null \
            || find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 \
               -printf '%10s  %p\n' 2>/dev/null \
            || echo "(none readable)"
          sudo -n find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 -delete 2>/dev/null \
            || find /tmp -maxdepth 1 -type f -name 'tmp*' -size +10M -mmin +60 -delete 2>/dev/null \
            || true

          echo "=== disk after cleanup ==="
          df -h / | tail -1

          AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
          if [ "$AVAIL_MB" -lt 3072 ]; then
            echo "ERROR: only ${AVAIL_MB} MB free on / after cleanup."
            echo "The GSTR-1 Excel export needs ~2.5 GB of scratch space to run."
            echo "Cleanup could not free enough, so something else is using the disk."
            echo "--- largest directories on / ---"
            sudo -n du -xh --max-depth=2 / 2>/dev/null | sort -rh | head -20 \
              || du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -20
            echo "--- notable paths ---"
            du -sh /tmp /var/log /var/www/asc-gstms/.xlsx_tmp 2>/dev/null || true
            echo "Send this output to whoever administers the VM."
            exit 1
          fi

          git pull --ff-only
          venv/bin/pip install -r requirements.txt --quiet
          sudo systemctl restart asc-gstms
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf -o /dev/null http://127.0.0.1:8502; then
              echo "App is up and responding."
              df -h / | tail -1
              exit 0
            fi
          done
          echo "App did not come back after restart. Recent logs:"
          journalctl -u asc-gstms -n 40 --no-pager
          exit 1
          DEPLOY
